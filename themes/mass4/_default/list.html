<article class="bg-dark p-3">
    <h1 class="fw-bolder text-capitalize">
    {{- page.Title }}
    </h1>

    <ul class="nav">
        {% for tag in page.TagsReference %}
        <li class="nav-item"><a class="nav-link" href="{{ tag.Permalink }}">#{{ tag.Title }}</a></li>
        {% endfor %}
    </ul>

    {{ page.ContentPreRendered }}

</article>
