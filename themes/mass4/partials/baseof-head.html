<title>{% if page.Title and page.Title != site.Title %}{{ page.Title }} — {{ site.Title }}{% else %}{{ site.Title }} — Eclectic, remote and provoking software{% endif %}</title>
{% if page.Description != nil and page.Description != "" -%}
<meta name="description" content="{{ page.Description }}">
{% elsif site.Params.Description != nil -%}
<meta name="description" content="{{ site.Params.Description }}">
{%- endif %}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="canonical" href="{{ site.BaseURL }}{{ page.Permalink }}">
<link rel="alternate" type="application/rss+xml" href="/news/index.xml" title="MASS4 News">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:title" content="{{ page.Title }}">
<meta property="og:url" content="{{ site.BaseURL }}{{ page.Permalink }}">

<!-- Styles -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/prism.css">
<script defer src="/prism.js"></script>

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0b0d12">
